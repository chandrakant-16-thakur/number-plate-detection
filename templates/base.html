<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ANPR System{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial,Helvetica,sans-serif;
            background:#f5f7fb;
            overflow-x:hidden;
        }

        .sidebar{
            position:fixed;
            left:0;
            top:0;
            width:270px;
            height:100vh;
            background:#0f172a;
            color:#fff;
            overflow-y:auto;
            padding:20px 0;
        }

        .sidebar .profile{
            text-align:center;
            margin-bottom:30px;
        }

        .sidebar .profile img{
            width:90px;
            border-radius:50%;
            border:3px solid white;
        }

        .sidebar .profile h5{
            margin-top:10px;
            color:white;
        }

        .sidebar .profile small{
            color:#cbd5e1;
        }

        .sidebar a{
            display:flex;
            align-items:center;
            gap:12px;
            text-decoration:none;
            color:white;
            padding:14px 20px;
            margin:5px 10px;
            border-radius:10px;
            transition:.3s;
        }

        .sidebar a:hover,
        .sidebar a.active{
            background:#2563eb;
        }

        .content{
            margin-left:270px;
            padding:20px;
        }

        .topbar{
            background:white;
            border-radius:12px;
            padding:15px 20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
            margin-bottom:20px;
        }

        .card{
            border:none;
            border-radius:15px;
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-5px);
            box-shadow:0 10px 20px rgba(0,0,0,.15);
        }
    </style>
</head>

<body>

<div class="sidebar">

    <div class="profile">
        <img src="https://i.pravatar.cc/120">
        <h5>Admin</h5>
        <small>AI Number Plate Recognition</small>
    </div>

    <a href="/dashboard" class="{% if request.path=='/dashboard' %}active{% endif %}">
        <i class="bi bi-grid-fill"></i> Dashboard
    </a>

    <a href="/" class="{% if request.path=='/' %}active{% endif %}">
        <i class="bi bi-upload"></i> Upload Image
    </a>

    <a href="/live" class="{% if request.path=='/live' %}active{% endif %}">
        <i class="bi bi-camera-video-fill"></i> Live Camera
    </a>

    <a href="/history" class="{% if request.path=='/history' %}active{% endif %}">
        <i class="bi bi-clock-history"></i> History
    </a>

    <a href="/search" class="{% if request.path=='/search' %}active{% endif %}">
        <i class="bi bi-search"></i> Search
    </a>

    <a href="/analytics" class="{% if request.path=='/analytics' %}active{% endif %}">
        <i class="bi bi-bar-chart-line-fill"></i> Analytics
    </a>

    <a href="/report">
        <i class="bi bi-file-earmark-pdf-fill"></i> PDF Report
    </a>

    <a href="/settings">
        <i class="bi bi-gear-fill"></i> Settings
    </a>

    <a href="/logout">
        <i class="bi bi-box-arrow-right"></i> Logout
    </a>

</div>

<div class="content">

    <div class="topbar">

        <h3>🚘 AI Number Plate Recognition</h3>

        <div>
            <i class="bi bi-bell-fill fs-5 me-3"></i>
            <i class="bi bi-person-circle fs-4"></i>
            <strong class="ms-2">Admin</strong>
        </div>

    </div>

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
