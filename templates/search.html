<!DOCTYPE html>
<html>

<head>

<title>Search Plate</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2>Search Number Plate</h2>

<a href="/" class="btn btn-secondary mb-3">Back Home</a>

<form method="POST">

<div class="input-group mb-4">

<input
type="text"
name="plate"
class="form-control"
placeholder="Enter Plate Number">

<button class="btn btn-primary">
Search
</button>

</div>

</form>

<table class="table table-bordered">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Plate</th>
<th>Image</th>
<th>Date</th>

</tr>

</thead>

<tbody>

{% for row in records %}

<tr>

<td>{{row.id}}</td>
<td>{{row.plate_number}}</td>
<td>{{row.image_name}}</td>
<td>{{row.date_time}}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>

</html>
