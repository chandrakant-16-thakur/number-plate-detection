{% extends "base.html" %}

{% block title %}
History
{% endblock %}

{% block content %}
<div class="card shadow">

    <div class="card-header bg-primary text-white">

        <h4 class="mb-0">
            Detection History
        </h4>

    </div>

    <div class="card-body">

        <table class="table table-hover table-bordered align-middle">

            <thead class="table-dark">

                <tr>

                    <th>ID</th>

                    <th>Vehicle</th>

                    <th>Plate Number</th>

                    <th>Date</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody>

            {% for row in records %}

                <tr>

                    <td>{{ loop.index }}</td>

                    <td>

                        <img
                            src="/uploads/{{ row.image_name }}"
                            class="img-thumbnail"
                            width="160">

                    </td>

                    <td>

                        <strong>

                            {{ row.plate_number }}

                        </strong>

                    </td>

                    <td>

                        {{ row.date_time }}

                    </td>

                    <td>

                        <a
                        href="/view/{{row.id}}"
                        class="btn btn-info btn-sm">

                        View

                        </a>

                        <a
                        href="/edit/{{row.id}}"
                        class="btn btn-warning btn-sm">

                        Edit

                        </a>

                        <form
                        action="/delete/{{row.id}}"
                        method="POST"
                        style="display:inline;">

                        <button
                        class="btn btn-danger btn-sm">

                        Delete

                        </button>

                        </form>

                    </td>

                </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>
{% endblock %}
