<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detection Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .box {
            width: 650px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        img {
            width: 500px;
            max-width: 100%;
            border-radius: 10px;
            margin-top: 15px;
        }

        h1 {
            color: #333;
        }

        h2 {
            color: green;
            margin-top: 20px;
        }

        h4 {
            color: green;
            margin-top: 10px;
        }

        a {
            text-decoration: none;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Detection Result</h1>

        <h4 style="color:green;">
            {{message}}
        </h4>

        <img src="/uploads/{{image}}" alt="Uploaded Image">

        <h2>{{plate}}</h2>

        <br><br>

        <a href="/">
            <button>Upload Another</button>
        </a>

    </div>

</body>

</html>
